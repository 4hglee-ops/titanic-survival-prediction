<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Titanic 생존 예측 실험과 의사결정 흐름</title>
  <desc id="desc">기본 모델 비교, 맥락 피처, 튜닝과 threshold, Ticket 피처 재검증, locked hold-out 평가를 요약한 흐름도</desc>
  <defs>
    <style>
      text { font-family: Arial, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
      .bg { fill:#f8fafc; }
      .past { fill:#eff6ff; stroke:#93c5fd; stroke-width:2; }
      .current { fill:#ecfdf5; stroke:#86efac; stroke-width:2; }
      .final { fill:#fff7ed; stroke:#fdba74; stroke-width:2; }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; }
      .title { fill:#0f172a; font-size:34px; font-weight:800; }
      .subtitle { fill:#475569; font-size:19px; }
      .section { fill:#2563eb; font-size:18px; font-weight:800; }
      .head { fill:#0f172a; font-size:21px; font-weight:800; }
      .body { fill:#1e293b; font-size:18px; }
      .small { fill:#475569; font-size:16px; }
      .metricBlue { fill:#1d4ed8; font-size:22px; font-weight:800; }
      .metricGreen { fill:#0f766e; font-size:22px; font-weight:800; }
      .warn { fill:#b45309; font-size:16px; font-weight:700; }
      .arrow { stroke:#94a3b8; stroke-width:4; fill:none; marker-end:url(#arrowhead); }
      .dash { stroke:#cbd5e1; stroke-width:2; stroke-dasharray:8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="560" rx="24"/>
  <text class="title" x="45" y="58">Titanic 생존 예측: 실험과 의사결정 흐름</text>
  <text class="subtitle" x="45" y="88">과거 학습 기록과 GitHub 재검증을 분리해 기록</text>

  <text class="section" x="45" y="128">과거 학습 실험</text>
  <line class="dash" x1="45" y1="140" x2="820" y2="140"/>
  <text class="section" x="850" y="128">GitHub 재검증</text>
  <line class="dash" x1="850" y1="140" x2="1155" y2="140"/>

  <rect class="past" x="45" y="165" width="230" height="210" rx="18"/>
  <text class="head" x="65" y="200">1. 기본 모델 비교</text>
  <text class="body" x="65" y="238">LR · RF · HGB · XGB</text>
  <text class="small" x="65" y="270">동일 5-Fold 기준</text>
  <text class="metricBlue" x="65" y="315">XGB F1 0.760</text>
  <text class="metricGreen" x="65" y="350">AUC 0.883</text>

  <path class="arrow" d="M285 270 H315"/>

  <rect class="past" x="330" y="165" width="230" height="210" rx="18"/>
  <text class="head" x="350" y="200">2. 맥락 피처</text>
  <text class="body" x="350" y="238">FamilySize · IsAlone</text>
  <text class="body" x="350" y="266">Title</text>
  <text class="metricBlue" x="350" y="315">HGB F1 0.773</text>
  <text class="small" x="350" y="348">XGB AUC 0.894</text>

  <path class="arrow" d="M570 270 H600"/>

  <rect class="past" x="615" y="165" width="230" height="210" rx="18"/>
  <text class="head" x="635" y="200">3. 튜닝 + threshold</text>
  <text class="small" x="635" y="236">모델별 OOF threshold 탐색</text>
  <text class="metricBlue" x="635" y="282">RF 0.46 → 0.7852</text>
  <text class="small" x="635" y="318">HGB 0.53 → 0.7814</text>
  <text class="small" x="635" y="348">XGB 0.42 → 0.7761</text>

  <path class="arrow" d="M855 270 H875"/>

  <rect class="current" x="890" y="165" width="265" height="210" rx="18"/>
  <text class="head" x="910" y="200">4. Ticket 피처 재검증</text>
  <text class="body" x="910" y="238">TicketGroupSize</text>
  <text class="body" x="910" y="266">FarePerPerson</text>
  <text class="small" x="910" y="297">각 학습 Fold 내부 계산</text>
  <text class="metricBlue" x="910" y="332">threshold 0.47</text>
  <text class="metricGreen" x="910" y="362">OOF F1 0.791</text>

  <rect class="panel" x="45" y="410" width="800" height="110" rx="18"/>
  <text class="head" x="65" y="442">피처 판단</text>
  <text class="body" x="65" y="474">유지: FamilySize · IsAlone · Title · TicketGroupSize · FarePerPerson</text>
  <text class="small" x="65" y="503">제외: CabinKnown — HGB F1 약 0.7733 → 0.7662</text>

  <rect class="final" x="890" y="410" width="265" height="110" rx="18"/>
  <text class="head" x="910" y="442">5. Locked hold-out</text>
  <text class="metricBlue" x="910" y="477">F1 0.766</text>
  <text class="metricGreen" x="1010" y="477">AUC 0.853</text>
  <text class="warn" x="910" y="505">결과를 보고 다시 조정하지 않음</text>

  <text class="small" x="45" y="548">※ 단계별 수치는 서로 다른 실험 조건을 포함하므로 단순 연속 상승 그래프로 해석하지 않습니다.</text>
</svg>